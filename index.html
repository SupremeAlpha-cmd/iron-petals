<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Iron Petals — M1 Solo Slice</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0d0f; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }

  /* ---------- Title screen ---------- */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, #1a1a20 0%, #0d0d0f 70%); z-index: 20; padding: 20px; text-align: center; }
  #title img { width: min(72vw, 340px); height: auto; }
  #title h1 { color: #e8e4da; margin: 0; font-size: 22px; letter-spacing: 4px; }
  #title p { color: #9a958a; margin: 0; font-size: 14px; line-height: 1.5; max-width: 420px; }
  #startBtn { margin-top: 8px; padding: 14px 44px; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: #111; background: #e8b64c; border: none; border-radius: 10px; cursor: pointer; }
  #startBtn:active { transform: scale(0.97); }
  .keys { color: #6f6c64; font-size: 12px; line-height: 1.6; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: none; z-index: 10; padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none; }
  #hud.on { display: block; }
  .bars { display: flex; gap: 10px; align-items: flex-start; }
  .fighter-bar { flex: 1; }
  .fighter-bar .name { color: #fff; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px #000; margin-bottom: 4px; }
  .fighter-bar.bot .name { text-align: right; }
  .hp { height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  .hp > div { height: 100%; width: 100%; transition: width .18s; }
  #playerHp > div { background: linear-gradient(90deg, #2dd4a7, #1fae87); }
  #botHp > div { background: linear-gradient(90deg, #e5484d, #b32e33); }
  #meterWrap { margin-top: 6px; }
  #meterWrap .label { color: #ffd76a; font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px #000; margin-bottom: 3px; }
  #meter { height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,215,106,.4); border-radius: 4px; overflow: hidden; }
  #meter > div { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd76a, #ff9d2e); transition: width .18s; }
  #meter.glow { box-shadow: 0 0 14px 2px rgba(255, 200, 60, .9); }

  /* ---------- Touch controls ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 10; pointer-events: none; }
  #touch.on { display: block; }
  #stickZone { position: absolute; left: 0; bottom: 0; width: 55%; height: 55%; pointer-events: auto; }
  #stickBase { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.30); display: none; transform: translate(-50%, -50%); }
  #stickKnob { position: absolute; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.5); display: none; transform: translate(-50%, -50%); }
  #buttons { position: absolute; right: 14px; bottom: calc(26px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: auto; }
  .btnRow { display: flex; gap: 12px; }
  .abtn { width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(20,20,24,.55); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 1px; cursor: pointer; user-select: none; }
  .abtn:active { background: rgba(255,255,255,.30); }
  .abtn.special { width: 80px; height: 80px; background: rgba(60,45,5,.65); border-color: rgba(255,215,106,.6); color: #ffd76a; }
  .abtn.special.ready { background: rgba(255,180,30,.9); color: #1a1200; box-shadow: 0 0 22px 4px rgba(255, 200, 60, .95); animation: pulse .7s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  /* ---------- Damage numbers, banner, errors ---------- */
  #dmgLayer { position: fixed; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
  .dmg { position: absolute; color: #fff; font-weight: 900; font-size: 26px; text-shadow: 0 2px 4px #000, 0 0 10px rgba(255,60,40,.8); transform: translate(-50%, -50%); }
  .dmg.crit { color: #ffd76a; font-size: 34px; }
  #banner { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 30; background: rgba(0,0,0,.45); }
  #banner.on { display: flex; }
  #banner h2 { color: #fff; font-size: 54px; margin: 0; letter-spacing: 6px; text-shadow: 0 4px 20px #000; }
  #banner p { color: #ddd; margin: 0; font-size: 16px; }
  #rematchBtn { padding: 14px 40px; font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #111; background: #e8b64c; border: none; border-radius: 10px; cursor: pointer; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50; background: #140a0a; color: #ffb4b4; padding: 24px; text-align: center; font-size: 15px; line-height: 1.6; }
  #err.on { display: flex; }
  #loadNote { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; color: #888; font-size: 12px; z-index: 5; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="game"></div>

<div id="title">
  <img src="logo.webp" alt="Iron Petals logo">
  <h1>IRON PETALS</h1>
  <p>M1 solo slice — you vs the bot in the courtyard.<br>Take hits to charge your special, then unleash Whirlwind Slash.</p>
  <button id="startBtn">START FIGHT</button>
  <div class="keys">Phone: left joystick to move · ATK / DASH / SP buttons<br>PC: WASD move · J attack · Space dash · K special</div>
</div>

<div id="hud">
  <div class="bars">
    <div class="fighter-bar">
      <div class="name">YOU</div>
      <div class="hp" id="playerHp"><div></div></div>
      <div id="meterWrap"><div class="label">SPECIAL</div><div id="meter"><div></div></div></div>
    </div>
    <div class="fighter-bar bot">
      <div class="name">BOT</div>
      <div class="hp" id="botHp"><div></div></div>
    </div>
  </div>
</div>

<div id="touch">
  <div id="stickZone"></div>
  <div id="stickBase"></div>
  <div id="stickKnob"></div>
  <div id="buttons">
    <button class="abtn special" id="btnSpecial">SP</button>
    <div class="btnRow">
      <button class="abtn" id="btnDash">DASH</button>
      <button class="abtn" id="btnAttack">ATK</button>
    </div>
  </div>
</div>

<div id="dmgLayer"></div>
<div id="banner"><h2 id="bannerTitle">K.O.</h2><p id="bannerSub"></p><button id="rematchBtn">REMATCH</button></div>
<div id="err"></div>
<div id="loadNote">Loading arena…</div>

<script type="module" src="main.js"></script>
</body>
</html>
